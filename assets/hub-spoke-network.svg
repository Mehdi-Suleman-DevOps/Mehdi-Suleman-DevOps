<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" width="100%" height="100%">
  <defs>
    <linearGradient id="netBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0c1322"/>
    </linearGradient>

    <linearGradient id="hubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="firewallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>

    <linearGradient id="netLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <filter id="firewallGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes netTraffic {
      from { stroke-dashoffset: 40; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes pulseFw {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 4px #ef4444); }
      50% { transform: scale(1.03); filter: drop-shadow(0 0 10px #f87171); }
    }
    @keyframes packetFlow {
      0% { offset-distance: 0%; }
      100% { offset-distance: 100%; }
    }
    .traffic-line {
      stroke: url(#netLineGrad);
      stroke-width: 2.5;
      stroke-dasharray: 6, 6;
      animation: netTraffic 1s linear infinite;
    }
    .traffic-solid {
      stroke: #334155;
      stroke-width: 3;
    }
    .fw-shield {
      animation: pulseFw 2.5s ease-in-out infinite;
      transform-origin: 440px 170px;
    }
    .text-title { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; fill: #f8fafc; }
    .text-label { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; fill: #cbd5e1; }
    .text-dim { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 10px; fill: #94a3b8; }
  </style>

  <!-- Canvas Background -->
  <rect width="880" height="370" rx="14" fill="url(#netBg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Top Title Bar -->
  <rect x="0" y="0" width="880" height="44" rx="14" fill="#0d1424"/>
  <rect x="0" y="30" width="880" height="14" fill="#0d1424"/>
  <line x1="0" y1="44" x2="880" y2="44" stroke="#1e293b" stroke-width="1.5"/>

  <circle cx="28" cy="22" r="5" fill="#ef4444"/>
  <circle cx="44" cy="22" r="5" fill="#f59e0b"/>
  <circle cx="60" cy="22" r="5" fill="#10b981"/>

  <text x="80" y="26" class="text-title" font-size="13" fill="#cbd5e1">ENTERPRISE ZERO-TRUST HUB-AND-SPOKE NETWORK ARCHITECTURE</text>
  <rect x="700" y="12" width="155" height="20" rx="10" fill="#064e3b" stroke="#059669" stroke-width="1"/>
  <text x="712" y="26" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#a7f3d0">🔒 100% PRIVATE LINK</text>

  <!-- ================= ON-PREMISES DATACENTER ================= -->
  <g transform="translate(30, 65)">
    <rect width="210" height="90" rx="10" fill="#111827" stroke="#374151" stroke-width="1.2"/>
    <rect x="0" y="0" width="210" height="26" rx="10" fill="#1f2937"/>
    <rect x="0" y="16" width="210" height="10" fill="#1f2937"/>
    <text x="12" y="18" class="text-title" font-size="11.5" fill="#f3f4f6">🏢 ON-PREMISES DATACENTER</text>
    <text x="12" y="44" class="text-label">• Non-Overlapping CIDRs</text>
    <text x="12" y="60" class="text-label">• Corporate Core IPAM</text>
    <text x="12" y="76" class="text-dim">CIDR: 10.0.0.0/16 (Assessed)</text>
  </g>

  <!-- Connection to Hub -->
  <line x1="240" y1="110" x2="310" y2="110" class="traffic-solid"/>
  <line x1="240" y1="110" x2="310" y2="110" class="traffic-line"/>
  <rect x="245" y="96" width="60" height="16" rx="4" fill="#082f49" stroke="#0284c7" stroke-width="0.8"/>
  <text x="250" y="108" font-family="'Segoe UI', sans-serif" font-size="8.5" font-weight="600" fill="#38bdf8">VPN / ER</text>

  <!-- ================= HUB VNET (CENTRAL CONNECTIVITY) ================= -->
  <g transform="translate(310, 65)">
    <!-- Hub Outer Box -->
    <rect width="260" height="275" rx="12" fill="url(#hubGrad)" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="260" height="30" rx="12" fill="#0369a1"/>
    <rect x="0" y="20" width="260" height="10" fill="#0369a1"/>
    <text x="14" y="20" class="text-title" font-size="12" fill="#ffffff">HUB VNet (Central 10.100.0.0/16)</text>

    <!-- Subnet 1: Gateway Subnet -->
    <g transform="translate(14, 42)">
      <rect width="232" height="42" rx="6" fill="#0f172a" stroke="#1e293b"/>
      <text x="10" y="18" class="text-title" font-size="10.5" fill="#38bdf8">GatewaySubnet</text>
      <text x="10" y="32" class="text-dim">ExpressRoute &amp; S2S VPN Gateway</text>
    </g>

    <!-- Subnet 2: Azure Firewall Premium -->
    <g transform="translate(14, 94)" class="fw-shield">
      <rect width="232" height="68" rx="8" fill="#1e1b2e" stroke="#ef4444" stroke-width="1.5" filter="url(#firewallGlow)"/>
      <rect width="232" height="68" rx="8" fill="#1e1b2e" stroke="#ef4444" stroke-width="1.5"/>
      <rect x="0" y="0" width="232" height="24" rx="8" fill="url(#firewallGrad)"/>
      <rect x="0" y="16" width="232" height="8" fill="url(#firewallGrad)"/>
      <text x="10" y="17" class="text-title" font-size="11" fill="#ffffff">🛡️ Azure Firewall Premium (NVA)</text>
      <text x="10" y="40" class="text-label" font-weight="600" fill="#fca5a5">• Central 0.0.0.0/0 UDR Inspection</text>
      <text x="10" y="56" class="text-dim">• TLS Inspection, IDPS &amp; FQDN Filter</text>
    </g>

    <!-- Subnet 3: Private DNS Zones -->
    <g transform="translate(14, 172)">
      <rect width="232" height="42" rx="6" fill="#0f172a" stroke="#1e293b"/>
      <text x="10" y="18" class="text-title" font-size="10.5" fill="#a78bfa">Central Private DNS Zones</text>
      <text x="10" y="32" class="text-dim">privatelink.azure.com resolution</text>
    </g>

    <!-- Subnet 4: Ingress Controller -->
    <g transform="translate(14, 222)">
      <rect width="232" height="40" rx="6" fill="#0f172a" stroke="#1e293b"/>
      <text x="10" y="18" class="text-title" font-size="10.5" fill="#34d399">Application Gateway / WAF</text>
      <text x="10" y="32" class="text-dim">Centralized Ingress with OWASP rules</text>
    </g>
  </g>

  <!-- Connections from Hub to Spokes -->
  <!-- Peering to Spoke 1 -->
  <path d="M 570 140 L 640 110" class="traffic-solid"/>
  <path d="M 570 140 L 640 110" class="traffic-line"/>
  <rect x="580" y="112" width="55" height="15" rx="3" fill="#064e3b" stroke="#10b981" stroke-width="0.8"/>
  <text x="584" y="123" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="700" fill="#6ee7b7">PEERING + UDR</text>

  <!-- Peering to Spoke 2 -->
  <path d="M 570 250 L 640 280" class="traffic-solid"/>
  <path d="M 570 250 L 640 280" class="traffic-line"/>
  <rect x="580" y="255" width="55" height="15" rx="3" fill="#064e3b" stroke="#10b981" stroke-width="0.8"/>
  <text x="584" y="266" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="700" fill="#6ee7b7">PEERING + UDR</text>

  <!-- ================= SPOKE 1: APP & WORKLOADS ================= -->
  <g transform="translate(640, 65)">
    <rect width="210" height="125" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
    <rect x="0" y="0" width="210" height="26" rx="10" fill="#065f46"/>
    <rect x="0" y="16" width="210" height="10" fill="#065f46"/>
    <text x="12" y="18" class="text-title" font-size="11.5" fill="#ffffff">SPOKE 1: APP VNet (AKS)</text>
    <text x="12" y="44" class="text-label">• App &amp; DB Tier Subnets</text>
    <text x="12" y="60" class="text-label">• Private Endpoints (SQL/KV)</text>
    <text x="12" y="76" class="text-label">• NSG/ASG Micro-segmentation</text>
    <text x="12" y="92" class="text-dim">UDR: 0.0.0.0/0 -> Firewall IP</text>
    <rect x="12" y="100" width="186" height="16" rx="4" fill="#022c22" stroke="#10b981" stroke-width="0.8"/>
    <text x="18" y="112" font-family="'Segoe UI', sans-serif" font-size="8.5" font-weight="700" fill="#34d399">ZERO PUBLIC IP EXPOSURE</text>
  </g>

  <!-- ================= SPOKE 2: SHARED INFRASTRUCTURE ================= -->
  <g transform="translate(640, 215)">
    <rect width="210" height="125" rx="10" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.2"/>
    <rect x="0" y="0" width="210" height="26" rx="10" fill="#5b21b6"/>
    <rect x="0" y="16" width="210" height="10" fill="#5b21b6"/>
    <text x="12" y="18" class="text-title" font-size="11.5" fill="#ffffff">SPOKE 2: SHARED VNet</text>
    <text x="12" y="44" class="text-label">• Self-Hosted CI/CD Runners</text>
    <text x="12" y="60" class="text-label">• Azure Bastion Host</text>
    <text x="12" y="76" class="text-label">• Security &amp; Monitoring Tools</text>
    <text x="12" y="92" class="text-dim">UDR: 0.0.0.0/0 -> Firewall IP</text>
    <rect x="12" y="100" width="186" height="16" rx="4" fill="#2e1065" stroke="#a855f7" stroke-width="0.8"/>
    <text x="18" y="112" font-family="'Segoe UI', sans-serif" font-size="8.5" font-weight="700" fill="#c084fc">ISOLATED MANAGEMENT RUNNERS</text>
  </g>

  <!-- Bottom Legend -->
  <text x="30" y="354" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#64748b">
    SECURITY: <tspan fill="#ef4444">Centralized Firewall TLS Inspection</tspan> • <tspan fill="#10b981">Zero Inbound Public Endpoints</tspan> • <tspan fill="#38bdf8">UDR 0.0.0.0/0 Routing</tspan>
  </text>
</svg>

