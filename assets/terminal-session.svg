<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#070a14"/>
    </linearGradient>

    <!-- Neon Logo Gradient -->
    <linearGradient id="neonLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Header Gradient -->
    <linearGradient id="termHeaderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="greenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes pulseEmblem {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 6px #00d2ff); }
      50% { transform: scale(1.03); filter: drop-shadow(0 0 14px #38bdf8); }
    }
    @keyframes scanline {
      0% { transform: translateY(0); }
      100% { transform: translateY(330px); }
    }
    @keyframes fadeInStagger {
      from { opacity: 0; transform: translateX(-6px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .term-cursor {
      animation: cursorBlink 0.85s infinite;
    }
    .neon-emblem {
      animation: pulseEmblem 3s ease-in-out infinite;
      transform-origin: 125px 175px;
    }
    .line-1 { animation: fadeInStagger 0.4s ease-out forwards; }
    .line-2 { animation: fadeInStagger 0.6s ease-out forwards; }
    .line-3 { animation: fadeInStagger 0.8s ease-out forwards; }
    .line-4 { animation: fadeInStagger 1.0s ease-out forwards; }
    .line-5 { animation: fadeInStagger 1.2s ease-out forwards; }
    .line-6 { animation: fadeInStagger 1.4s ease-out forwards; }
    .line-7 { animation: fadeInStagger 1.6s ease-out forwards; }
    .line-8 { animation: fadeInStagger 1.8s ease-out forwards; }
    .line-9 { animation: fadeInStagger 2.0s ease-out forwards; }

    .term-prompt { font-family: 'Fira Code', 'Consolas', monospace; font-size: 13px; font-weight: 700; fill: #10b981; }
    .term-cmd { font-family: 'Fira Code', 'Consolas', monospace; font-size: 13px; fill: #f8fafc; font-weight: 600; }
    .spec-key { font-family: 'Fira Code', 'Consolas', monospace; font-size: 11.5px; fill: #94a3b8; font-weight: 600; }
    .spec-sep { font-family: 'Fira Code', 'Consolas', monospace; font-size: 11.5px; fill: #64748b; }
    .spec-val { font-family: 'Fira Code', 'Consolas', monospace; font-size: 11.5px; fill: #f1f5f9; font-weight: 500; }
    .spec-hl { font-family: 'Fira Code', 'Consolas', monospace; font-size: 11.5px; fill: #38bdf8; font-weight: 700; }
    .spec-sec { font-family: 'Fira Code', 'Consolas', monospace; font-size: 11.5px; fill: #34d399; font-weight: 700; }
    .spec-ai { font-family: 'Fira Code', 'Consolas', monospace; font-size: 11.5px; fill: #c084fc; font-weight: 700; }
  </style>

  <!-- Terminal Window Frame -->
  <rect width="880" height="330" rx="12" fill="url(#termBg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Terminal Title Bar -->
  <rect x="0" y="0" width="880" height="36" rx="12" fill="url(#termHeaderGrad)"/>
  <rect x="0" y="24" width="880" height="12" fill="url(#termHeaderGrad)"/>
  <line x1="0" y1="36" x2="880" y2="36" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Window Control Buttons -->
  <circle cx="22" cy="18" r="5.5" fill="#ef4444"/>
  <circle cx="40" cy="18" r="5.5" fill="#f59e0b"/>
  <circle cx="58" cy="18" r="5.5" fill="#10b981"/>

  <!-- Terminal Title -->
  <text x="440" y="22" font-family="'Fira Code', monospace" font-size="11.5" fill="#94a3b8" text-anchor="middle" font-weight="600">mehdi@devops-control-plane: ~ (zsh) • [azure-prod: main]</text>

  <!-- Interactive Status Pill -->
  <rect x="740" y="8" width="122" height="20" rx="10" fill="#064e3b" stroke="#059669" stroke-width="1"/>
  <circle cx="752" cy="18" r="3.5" fill="#10b981" filter="url(#greenGlow)"/>
  <text x="762" y="22" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#a7f3d0">CLUSTER ONLINE</text>

  <!-- ================= TERMINAL COMMAND LINE ================= -->
  <g transform="translate(25, 62)">
    <text x="0" y="0" class="term-prompt">mehdi@devops-control-plane:~$ </text>
    <text x="245" y="0" class="term-cmd">neofetch --profile</text>
  </g>

  <!-- ================= LEFT: CYBER DEVSECOPS LOGO EMBLEM ================= -->
  <g transform="translate(30, 92)" class="neon-emblem">
    <!-- Outer Hexagon / Shield Frame -->
    <polygon points="95,10 170,50 170,140 95,180 20,140 20,50" fill="#0c1629" stroke="url(#neonLogoGrad)" stroke-width="2.5"/>
    <polygon points="95,20 160,55 160,135 95,170 30,135 30,55" fill="#080e1a" stroke="#1e293b" stroke-width="1"/>

    <!-- Inner DevSecOps Cyber Shield & Lock Icon -->
    <!-- Cloud Arc -->
    <path d="M 60 85 C 60 70, 75 62, 95 62 C 115 62, 130 70, 130 85 C 138 85, 144 92, 144 100 C 144 108, 138 114, 130 114 L 60 114 C 52 114, 46 108, 46 100 C 46 92, 52 85, 60 85 Z" fill="#0f172a" stroke="#00d2ff" stroke-width="2"/>
    
    <!-- Shield Symbol -->
    <path d="M 95 90 L 115 98 L 115 125 C 115 138, 95 148, 95 148 C 95 148, 75 138, 75 125 L 75 98 Z" fill="#064e3b" stroke="#10b981" stroke-width="1.8"/>
    
    <!-- Keyhole -->
    <circle cx="95" cy="112" r="3.5" fill="#ffffff"/>
    <polygon points="93.5,112 96.5,112 98,124 92,124" fill="#ffffff"/>

    <!-- Bottom Badge in Logo -->
    <rect x="42" y="152" width="106" height="18" rx="4" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1"/>
    <text x="95" y="165" font-family="'Fira Code', monospace" font-size="9" font-weight="700" fill="#c084fc" text-anchor="middle">DEVSECOPS CORE</text>
  </g>

  <!-- Vertical Divider Line -->
  <line x1="240" y1="90" x2="240" y2="285" stroke="#1e293b" stroke-width="1.2" stroke-dasharray="4, 4"/>

  <!-- ================= RIGHT: NEOFETCH SYSTEM METRICS ================= -->
  <g transform="translate(265, 96)">
    <!-- Line 1: OS -->
    <g class="line-1" transform="translate(0, 14)">
      <text x="0" y="0" class="spec-key">OS</text>
      <text x="90" y="0" class="spec-sep">:</text>
      <text x="105" y="0" class="spec-val">Azure Linux Enterprise / Hardened Kernel (x86_64)</text>
    </g>

    <!-- Line 2: Engineer -->
    <g class="line-2" transform="translate(0, 34)">
      <text x="0" y="0" class="spec-key">Engineer</text>
      <text x="90" y="0" class="spec-sep">:</text>
      <text x="105" y="0" class="spec-hl">Mehdi Suleman</text>
    </g>

    <!-- Line 3: Role -->
    <g class="line-3" transform="translate(0, 54)">
      <text x="0" y="0" class="spec-key">Role</text>
      <text x="90" y="0" class="spec-sep">:</text>
      <text x="105" y="0" class="spec-val">Senior DevSecOps &amp; Enterprise Automation Engineer</text>
    </g>

    <!-- Line 4: Specialty -->
    <g class="line-4" transform="translate(0, 74)">
      <text x="0" y="0" class="spec-key">Specialty</text>
      <text x="90" y="0" class="spec-sep">:</text>
      <text x="105" y="0" class="spec-val">Azure CAF Landing Zones <tspan fill="#64748b">|</tspan> Terraform IaC <tspan fill="#64748b">|</tspan> Zero-Trust</text>
    </g>

    <!-- Line 5: DevSecOps -->
    <g class="line-5" transform="translate(0, 94)">
      <text x="0" y="0" class="spec-key">DevSecOps</text>
      <text x="90" y="0" class="spec-sep">:</text>
      <text x="105" y="0" class="spec-sec">Shift-Left Gates (GitLeaks, Checkov, Trivy, PIM JIT)</text>
    </g>

    <!-- Line 6: AIOps -->
    <g class="line-6" transform="translate(0, 114)">
      <text x="0" y="0" class="spec-key">AIOps</text>
      <text x="90" y="0" class="spec-sep">:</text>
      <text x="105" y="0" class="spec-ai">LLM Incident RCA (GPT-4o) <tspan fill="#64748b">|</tspan> K8sGPT <tspan fill="#64748b">|</tspan> Runbook RAG</text>
    </g>

    <!-- Line 7: FinOps -->
    <g class="line-7" transform="translate(0, 134)">
      <text x="0" y="0" class="spec-key">FinOps</text>
      <text x="90" y="0" class="spec-sep">:</text>
      <text x="105" y="0" class="spec-val">35%+ Waste Reduced <tspan fill="#64748b">|</tspan> Ingestion Tuning (DCR) <tspan fill="#64748b">|</tspan> RIs &amp; SP</text>
    </g>

    <!-- Line 8: Status -->
    <g class="line-8" transform="translate(0, 154)">
      <text x="0" y="0" class="spec-key">Status</text>
      <text x="90" y="0" class="spec-sep">:</text>
      <circle cx="112" cy="-4" r="4.5" fill="#10b981" filter="url(#greenGlow)"/>
      <text x="124" y="0" font-family="'Fira Code', monospace" font-size="11.5" font-weight="700" fill="#34d399">99.99% Production SLA</text>
      <text x="290" y="0" class="spec-sep">|</text>
      <text x="304" y="0" class="spec-val">Zero Unauthenticated Ingress</text>
    </g>
  </g>

  <!-- ================= ACTIVE TERMINAL PROMPT & BLINKING CURSOR ================= -->
  <g transform="translate(25, 298)">
    <text x="0" y="0" class="term-prompt">mehdi@devops-control-plane:~$</text>
    <rect x="236" y="-12" width="8" height="15" fill="#00d2ff" class="term-cursor" filter="url(#neonGlow)"/>
  </g>
</svg>

