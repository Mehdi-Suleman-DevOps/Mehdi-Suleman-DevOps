<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 310" width="100%" height="100%">
  <defs>
    <linearGradient id="finBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16"/>
      <stop offset="100%" stop-color="#0d1424"/>
    </linearGradient>

    <linearGradient id="finCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141c2e"/>
      <stop offset="100%" stop-color="#0b111e"/>
    </linearGradient>

    <linearGradient id="finFlowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <filter id="finGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes finDash {
      from { stroke-dashoffset: 32; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes pulseFin {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }
    .fin-track {
      stroke: url(#finFlowGrad);
      stroke-width: 2.5;
      stroke-dasharray: 6, 6;
      animation: finDash 1.2s linear infinite;
    }
    .fin-solid {
      stroke: #334155;
      stroke-width: 2.5;
    }
    .fin-badge {
      animation: pulseFin 2s ease-in-out infinite;
      transform-origin: center;
    }
    .txt-bold { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; fill: #f8fafc; }
    .txt-body { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; fill: #cbd5e1; }
    .txt-sub { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 10px; fill: #94a3b8; }
  </style>

  <!-- Background Canvas -->
  <rect width="880" height="310" rx="14" fill="url(#finBg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Top Title Bar -->
  <rect x="0" y="0" width="880" height="44" rx="14" fill="#0d1424"/>
  <rect x="0" y="30" width="880" height="14" fill="#0d1424"/>
  <line x1="0" y1="44" x2="880" y2="44" stroke="#1e293b" stroke-width="1.5"/>

  <circle cx="28" cy="22" r="5" fill="#ef4444"/>
  <circle cx="44" cy="22" r="5" fill="#f59e0b"/>
  <circle cx="60" cy="22" r="5" fill="#10b981"/>

  <text x="80" y="26" class="txt-bold" font-size="13" fill="#cbd5e1">ENTERPRISE FINOPS: CONTINUOUS CLOUD FINANCIAL OPTIMIZATION</text>
  <rect x="690" y="12" width="165" height="20" rx="10" fill="#064e3b" stroke="#059669" stroke-width="1" class="fin-badge"/>
  <text x="702" y="26" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#a7f3d0">💰 35%+ COST REDUCTION</text>

  <!-- Flow Connector Line -->
  <line x1="160" y1="60" x2="720" y2="60" class="fin-solid"/>
  <line x1="160" y1="60" x2="720" y2="60" class="fin-track"/>

  <!-- ================= CARD 1: ELIMINATE WASTE ================= -->
  <g transform="translate(30, 75)">
    <rect width="250" height="195" rx="10" fill="url(#finCardGrad)" stroke="#ef4444" stroke-width="1.2"/>
    <rect x="0" y="0" width="250" height="28" rx="10" fill="#991b1b"/>
    <rect x="0" y="18" width="250" height="10" fill="#991b1b"/>
    <text x="12" y="19" class="txt-bold" font-size="11.5" fill="#ffffff">01. ELIMINATE WASTE</text>

    <g transform="translate(12, 40)">
      <text x="0" y="14" class="txt-body" font-weight="600">• Orphan Managed Disks</text>
      <text x="10" y="28" class="txt-sub">Detect &amp; delete unattached disks</text>

      <text x="0" y="50" class="txt-body" font-weight="600">• Obsolete Snapshots &amp; NICs</text>
      <text x="10" y="64" class="txt-sub">Automate 30-day snapshot purge</text>

      <text x="0" y="86" class="txt-body" font-weight="600">• Unassociated Public IPs</text>
      <text x="10" y="100" class="txt-sub">Release idle IPv4 addresses</text>

      <rect y="112" width="226" height="22" rx="4" fill="#450a0a" stroke="#ef4444" stroke-width="0.8"/>
      <text x="24" y="127" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="700" fill="#fca5a5">ZERO UNUSED ASSET SPEND</text>
    </g>
  </g>

  <!-- ================= CARD 2: RIGHTSIZING & SCALING ================= -->
  <g transform="translate(315, 75)">
    <rect width="250" height="195" rx="10" fill="url(#finCardGrad)" stroke="#f59e0b" stroke-width="1.5" filter="url(#finGlow)"/>
    <rect width="250" height="195" rx="10" fill="url(#finCardGrad)" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="0" y="0" width="250" height="28" rx="10" fill="#b45309"/>
    <rect x="0" y="18" width="250" height="10" fill="#b45309"/>
    <text x="12" y="19" class="txt-bold" font-size="11.5" fill="#ffffff">02. RIGHTSIZING &amp; SCALING</text>

    <g transform="translate(12, 40)">
      <text x="0" y="14" class="txt-body" font-weight="600">• 30-Day P95 Utilization Audit</text>
      <text x="10" y="28" class="txt-sub">Resize oversized VMs and AKS nodes</text>

      <text x="0" y="50" class="txt-body" font-weight="600">• Automated Off-Hours Stop/Start</text>
      <text x="10" y="64" class="txt-sub">Auto-shutdown dev/UAT on weekends</text>

      <text x="0" y="86" class="txt-body" font-weight="600">• Log Ingestion DCR Tuning</text>
      <text x="10" y="100" class="txt-sub">Filter verbose telemetry at source (-40%)</text>

      <rect y="112" width="226" height="22" rx="4" fill="#451a03" stroke="#f59e0b" stroke-width="0.8"/>
      <text x="22" y="127" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="700" fill="#fde68a">CONTINUOUS SCALE MATCHING</text>
    </g>
  </g>

  <!-- ================= CARD 3: COMMITMENT DISCOUNTS ================= -->
  <g transform="translate(600, 75)">
    <rect width="250" height="195" rx="10" fill="url(#finCardGrad)" stroke="#10b981" stroke-width="1.2"/>
    <rect x="0" y="0" width="250" height="28" rx="10" fill="#047857"/>
    <rect x="0" y="18" width="250" height="10" fill="#047857"/>
    <text x="12" y="19" class="txt-bold" font-size="11.5" fill="#ffffff">03. COMMITMENTS &amp; SAVINGS</text>

    <g transform="translate(12, 40)">
      <text x="0" y="14" class="txt-body" font-weight="600">• Reserved Instances (1-Yr / 3-Yr)</text>
      <text x="10" y="28" class="txt-sub">Up to 72% savings on baseline VMs</text>

      <text x="0" y="50" class="txt-body" font-weight="600">• Azure Savings Plans</text>
      <text x="10" y="64" class="txt-sub">Flexible compute discount across services</text>

      <text x="0" y="86" class="txt-body" font-weight="600">• Spot Instances for Batch Jobs</text>
      <text x="10" y="100" class="txt-sub">Up to 90% savings for stateless tasks</text>

      <rect y="112" width="226" height="22" rx="4" fill="#022c22" stroke="#10b981" stroke-width="0.8"/>
      <text x="24" y="127" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="700" fill="#6ee7b7">MAXIMIZED CLOUD ROI</text>
    </g>
  </g>

  <!-- Bottom Legend -->
  <text x="30" y="292" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#64748b">
    FINOPS FRAMEWORK: <tspan fill="#ef4444">Zero Waste Policy</tspan> • <tspan fill="#f59e0b">DCR Log Ingestion Optimization</tspan> • <tspan fill="#10b981">Infracost Shift-Left PR Checks</tspan>
  </text>
</svg>

