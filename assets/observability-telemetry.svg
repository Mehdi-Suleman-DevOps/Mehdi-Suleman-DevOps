<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="100%" height="100%">
  <defs>
    <linearGradient id="obsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16"/>
      <stop offset="100%" stop-color="#0d1424"/>
    </linearGradient>

    <linearGradient id="obsCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141c2e"/>
      <stop offset="100%" stop-color="#0b111e"/>
    </linearGradient>

    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <filter id="obsGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes streamDash {
      from { stroke-dashoffset: 40; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes alertPulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 3px #ef4444); }
      50% { transform: scale(1.05); filter: drop-shadow(0 0 8px #f87171); }
    }
    .obs-stream {
      stroke: url(#streamGrad);
      stroke-width: 2.5;
      stroke-dasharray: 6, 6;
      animation: streamDash 1.2s linear infinite;
    }
    .obs-solid {
      stroke: #334155;
      stroke-width: 2.5;
    }
    .alert-badge {
      animation: alertPulse 2s ease-in-out infinite;
      transform-origin: center;
    }
    .txt-title { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; fill: #f8fafc; }
    .txt-body { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; fill: #cbd5e1; }
    .txt-sub { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 10px; fill: #94a3b8; }
  </style>

  <!-- Background -->
  <rect width="880" height="340" rx="14" fill="url(#obsBg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Top Title Bar -->
  <rect x="0" y="0" width="880" height="44" rx="14" fill="#0d1424"/>
  <rect x="0" y="30" width="880" height="14" fill="#0d1424"/>
  <line x1="0" y1="44" x2="880" y2="44" stroke="#1e293b" stroke-width="1.5"/>

  <circle cx="28" cy="22" r="5" fill="#ef4444"/>
  <circle cx="44" cy="22" r="5" fill="#f59e0b"/>
  <circle cx="60" cy="22" r="5" fill="#10b981"/>

  <text x="80" y="26" class="txt-title" font-size="13" fill="#cbd5e1">ENTERPRISE OBSERVABILITY, AMA TELEMETRY &amp; INCIDENT ESCALATION</text>
  <rect x="715" y="12" width="140" height="20" rx="10" fill="#064e3b" stroke="#059669" stroke-width="1"/>
  <text x="726" y="26" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#a7f3d0">🟢 TELEMETRY HEALTHY</text>

  <!-- Stream Connectors -->
  <!-- Col 1 to Col 2 -->
  <line x1="230" y1="175" x2="310" y2="175" class="obs-solid"/>
  <line x1="230" y1="175" x2="310" y2="175" class="obs-stream"/>

  <!-- Col 2 to Col 3 -->
  <line x1="560" y1="175" x2="640" y2="175" class="obs-solid"/>
  <line x1="560" y1="175" x2="640" y2="175" class="obs-stream"/>

  <!-- ================= COL 1: TELEMETRY SOURCES ================= -->
  <g transform="translate(30, 65)">
    <rect width="200" height="235" rx="10" fill="url(#obsCardGrad)" stroke="#38bdf8" stroke-width="1.2"/>
    <rect x="0" y="0" width="200" height="30" rx="10" fill="#0369a1"/>
    <rect x="0" y="20" width="200" height="10" fill="#0369a1"/>
    <text x="12" y="20" class="txt-title" font-size="11.5" fill="#ffffff">01. TELEMETRY SOURCES</text>

    <g transform="translate(10, 42)">
      <rect width="180" height="42" rx="6" fill="#0f172a" stroke="#1e293b"/>
      <text x="10" y="18" class="txt-title" font-size="10.5" fill="#38bdf8">Compute Layer</text>
      <text x="10" y="32" class="txt-sub">Azure VMs, VMSS &amp; Bastion</text>

      <rect y="50" width="180" height="42" rx="6" fill="#0f172a" stroke="#1e293b"/>
      <text x="10" y="68" class="txt-title" font-size="10.5" fill="#818cf8">Container Layer</text>
      <text x="10" y="82" class="txt-sub">AKS Clusters, Istio Mesh Pods</text>

      <rect y="100" width="180" height="42" rx="6" fill="#0f172a" stroke="#1e293b"/>
      <text x="10" y="118" class="txt-title" font-size="10.5" fill="#34d399">PaaS Services</text>
      <text x="10" y="132" class="txt-sub">Azure SQL, Storage, Key Vault</text>

      <rect y="152" width="180" height="24" rx="4" fill="#082f49" stroke="#0ea5e9" stroke-width="0.8"/>
      <text x="22" y="168" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="700" fill="#7dd3fc">DISTRIBUTED LOG STREAM</text>
    </g>
  </g>

  <!-- ================= COL 2: INGESTION & CENTRAL ANALYTICS ================= -->
  <g transform="translate(310, 65)">
    <rect width="250" height="235" rx="10" fill="url(#obsCardGrad)" stroke="#6366f1" stroke-width="1.5" filter="url(#obsGlow)"/>
    <rect width="250" height="235" rx="10" fill="url(#obsCardGrad)" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="0" y="0" width="250" height="30" rx="10" fill="#4338ca"/>
    <rect x="0" y="20" width="250" height="10" fill="#4338ca"/>
    <text x="14" y="20" class="txt-title" font-size="11.5" fill="#ffffff">02. AMA &amp; LOG ANALYTICS</text>

    <g transform="translate(14, 42)">
      <!-- AMA Box -->
      <rect width="222" height="52" rx="6" fill="#1e1b4b" stroke="#6366f1"/>
      <text x="10" y="18" class="txt-title" font-size="10.5" fill="#a5b4fc">Azure Monitor Agent (AMA)</text>
      <text x="10" y="32" class="txt-sub">• Data Collection Rules (DCR)</text>
      <text x="10" y="44" class="txt-sub">• 40% Cost Saved: Filter at source</text>

      <!-- LAW Box -->
      <rect y="60" width="222" height="64" rx="6" fill="#0f172a" stroke="#1e293b"/>
      <text x="10" y="78" class="txt-title" font-size="10.5" fill="#f43f5e">Log Analytics Workspace (LAW)</text>
      <text x="10" y="94" class="txt-sub">• Centralized KQL Query Engine</text>
      <text x="10" y="106" class="txt-sub">• Microsoft Sentinel SIEM Ingestion</text>
      <text x="10" y="118" class="txt-sub">• Role-Based Workspace Access</text>

      <rect y="132" width="222" height="24" rx="4" fill="#311042" stroke="#d946ef" stroke-width="0.8"/>
      <text x="24" y="148" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="700" fill="#f5d0fe">KQL ALERT RULES TRIGGERED</text>
    </g>
  </g>

  <!-- ================= COL 3: ESCALATION & AUTOMATION ================= -->
  <g transform="translate(640, 65)">
    <rect width="210" height="235" rx="10" fill="url(#obsCardGrad)" stroke="#ef4444" stroke-width="1.2"/>
    <rect x="0" y="0" width="210" height="30" rx="10" fill="#b91c1c"/>
    <rect x="0" y="20" width="210" height="10" fill="#b91c1c"/>
    <text x="12" y="20" class="txt-title" font-size="11.5" fill="#ffffff">03. ESCALATION &amp; ACTIONS</text>

    <g transform="translate(10, 42)">
      <rect width="190" height="42" rx="6" fill="#0f172a" stroke="#1e293b"/>
      <text x="10" y="18" class="txt-title" font-size="10.5" fill="#38bdf8">MS Teams &amp; Slack</text>
      <text x="10" y="32" class="txt-sub">Dynamic alert cards with context</text>

      <rect y="50" width="190" height="42" rx="6" fill="#1c1917" stroke="#ef4444" class="alert-badge"/>
      <text x="10" y="68" class="txt-title" font-size="10.5" fill="#f87171">🚨 PagerDuty (P1 / Critical)</text>
      <text x="10" y="82" class="txt-sub">On-Call escalation &lt;1 min</text>

      <rect y="100" width="190" height="42" rx="6" fill="#0f172a" stroke="#1e293b"/>
      <text x="10" y="118" class="txt-title" font-size="10.5" fill="#34d399">⚡ Azure Automation</text>
      <text x="10" y="132" class="txt-sub">Self-healing runbooks triggered</text>

      <rect y="152" width="190" height="24" rx="4" fill="#450a0a" stroke="#ef4444" stroke-width="0.8"/>
      <text x="24" y="168" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="700" fill="#fca5a5">SUB-MINUTE MTTA RESPONSE</text>
    </g>
  </g>

  <!-- Bottom Legend -->
  <text x="30" y="322" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#64748b">
    MONITORING: <tspan fill="#6366f1">AMA with Source DCR Filtering</tspan> • <tspan fill="#f43f5e">Log Analytics &amp; Sentinel</tspan> • <tspan fill="#ef4444">PagerDuty P1 Escalation</tspan>
  </text>
</svg>

